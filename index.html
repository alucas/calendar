<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="description" content="Agenda personnel installable et utilisable hors-ligne." />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Agenda" />

  <title>Agenda</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="card">
    <img class="logo" src="./icons/icon-192.png" alt="" width="96" height="96" />
    <h1>Bienvenue&nbsp;👋</h1>
    <p class="subtitle">Votre application est prête et fonctionne hors-ligne.</p>

    <button id="install" class="install" hidden>Installer sur mon téléphone</button>

    <div id="install-hint" class="hint" hidden>
      <p class="hint-title" id="hint-title">Pour installer l'application :</p>
      <ol class="hint-steps" id="hint-steps"></ol>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
